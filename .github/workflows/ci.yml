name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build, vet, lint, test
    runs-on: ubuntu-latest
    # Postgres and Redis back internal/store's and internal/cache's (and
    # internal/failuredetector's) integration tests (see the Test step's env
    # below); they skip themselves if these env vars are unset, but CI
    # always provides them so the tests run on every push/PR.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # .golangci.yml uses the v2 config schema (`version: "2"`), which requires
          # golangci-lint v2 and action v7+ (v6 and earlier default to resolving a v1 binary).
          version: v2.12.2

      - name: Test
        env:
          ARBITER_TEST_POSTGRES_URL: postgres://arbiter:arbiter@localhost:5432/arbiter?sslmode=disable
          ARBITER_TEST_REDIS_ADDR: localhost:6379
        run: go test ./... -race -count=1
