name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # .golangci.yml uses the v2 config schema (`version: "2"`), which requires
          # golangci-lint v2 and action v7+ (v6 and earlier default to resolving a v1 binary).
          version: v2.12.2

      - name: Test
        run: go test ./... -race -count=1
