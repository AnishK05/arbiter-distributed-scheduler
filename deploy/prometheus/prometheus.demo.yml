global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: arbiter-scheduler
    metrics_path: /metrics
    static_configs:
      - targets:
          - scheduler:8080
          - scheduler-2:8080
          - scheduler-3:8080
        labels:
          component: scheduler

  - job_name: arbiter-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:8081
          - worker-2:8081
          - worker-3:8081
          - worker-4:8081
          - worker-5:8081
          - worker-6:8081
          - worker-7:8081
          - worker-8:8081
          - worker-9:8081
          - worker-10:8081
        labels:
          component: worker
