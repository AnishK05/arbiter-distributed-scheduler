# Local dev stack: Postgres + Redis, plus one scheduler replica and one
# worker node — enough to exercise node registration, heartbeats, failure
# detection, and task execution end to end (Phases 1-3). Additional
# scheduler replicas (leader election, Phase 6) and more workers
# (bin-packing/chaos testing, Phase 4+) are added via a separate
# docker-compose.demo.yml once those phases land; see
# IMPLEMENTATION_PLAN.md Section 5 & 8.
#
# Usage: `make up` / `make down`, or `docker compose -f deploy/docker-compose.yml up`.
# `make run-scheduler` / `make run-worker` remain available for running
# either binary directly on the host (e.g. for faster edit/rebuild cycles)
# against the Dockerized Postgres/Redis instead.
#
# The worker mounts the host Docker socket so it can launch sibling task
# containers (Docker-out-of-Docker). The `workload` service builds the
# `arbiter-workload:latest` image onto that same daemon for tasks to use.

services:
  postgres:
    image: postgres:16-alpine
    container_name: arbiter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: arbiter
      POSTGRES_DB: arbiter
    ports:
      - "5432:5432"
    volumes:
      - arbiter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiter -d arbiter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arbiter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Build-only service: produces arbiter-workload:latest on the host Docker
  # daemon so workers can launch sibling task containers from it. Exits
  # immediately after the image is built (`restart: "no"`).
  workload:
    build:
      context: ..
      dockerfile: Dockerfile.workload
    image: arbiter-workload:latest
    container_name: arbiter-workload-build
    command: ["true"]
    restart: "no"

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile.scheduler
    container_name: arbiter-scheduler
    restart: unless-stopped
    environment:
      ARBITER_POSTGRES_URL: postgres://arbiter:arbiter@postgres:5432/arbiter?sslmode=disable
      ARBITER_REDIS_ADDR: redis:6379
    ports:
      - "7000:7000"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: arbiter-worker-1
    restart: unless-stopped
    environment:
      ARBITER_SCHEDULER_ADDR: scheduler:7000
      # Talk to the host Docker daemon (sibling containers for tasks).
      DOCKER_HOST: unix:///var/run/docker.sock
    command:
      - "--hostname=worker-1"
      - "--cpu-capacity-millicores=2000"
      - "--mem-capacity-mb=1024"
    ports:
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      scheduler:
        condition: service_healthy
      workload:
        condition: service_completed_successfully

volumes:
  arbiter-postgres-data:
